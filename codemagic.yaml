workflows:
  ios-release:
    name: iOS Release
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned IPA
        script: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          zip -r ../ipa/emk_app.ipa Payload/
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - emkurr@yandex.ru
