name: Build IPA for Manual Upload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: |
        flutter clean
        flutter pub get
        
    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
        cd ..
    
    - name: Build iOS app
      run: flutter build ios --release --no-codesign
    
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/ios/iphoneos/Runner.app Payload/
        zip -r EMK_v1.0.ipa Payload
    
    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      run: |
        echo "$APP_STORE_CONNECT_PRIVATE_KEY" > private_key.p8
        xcrun altool --upload-app --file EMK_v1.0.ipa --type ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" --apiPrivateKey private_key.p8 || true
      continue-on-error: true
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: EMK-v1.0
        path: EMK_v1.0.ipa
