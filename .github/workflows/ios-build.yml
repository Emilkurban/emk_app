- name: Build and Sign Xcode Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # 1. Сначала подготавливаем iOS файлы через Flutter
          flutter build ios --release --no-codesign
          
          # 2. Создаем временный файл настроек экспорта ЗАРАНЕЕ, 
          # чтобы Xcode знал, что мы собираем App Store (Release) версию
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          # 3. Собираем архив, явно указывая тип сборки, чтобы избежать ошибок с "Device isn't registered"
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/ios/Runner.xcarchive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$KEY_ID" \
                     -authenticationKeyIssuerID "$ISSUER_ID" \
                     -authenticationKeyPath "$HOME/.private_keys/AuthKey_$KEY_ID.p8" \
                     CODE_SIGN_STYLE="Automatic" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="9FDTFY8954" \
                     archive

          # 4. Экспортируем готовый .ipa
          xcodebuild -exportArchive \
                     -archivePath build/ios/Runner.xcarchive \
                     -exportPath build/ios/ipa \
                     -exportOptionsPlist exportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$KEY_ID" \
                     -authenticationKeyIssuerID "$ISSUER_ID" \
                     -authenticationKeyPath "$HOME/.private_keys/AuthKey_$KEY_ID.p8"
