name: iOS Build and Publish

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Install Apple Private Key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_$KEY_ID.p8

      - name: Build Xcode Archive
        run: |
          # Собираем приложение в релизном режиме без локальной подписи
          flutter build ios --release --no-codesign

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Находим скомпилированное приложение Runner.app
          ARCHIVE_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          echo "Found App Bundle at: $ARCHIVE_PATH"
          
          # Упаковываем его в архив, так как altool требует упакованный формат
          zip -r build/ios/iphoneos/emk_app.zip "$ARCHIVE_PATH"
          
          # Отправляем готовый архив напрямую в TestFlight / App Store Connect
          xcrun altool --upload-app --type ios --file build/ios/iphoneos/emk_app.zip --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
