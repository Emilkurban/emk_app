name: iOS Build and Publish

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Install Apple Private Key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_$KEY_ID.p8

      - name: Build Xcode Archive
        run: |
          # Собираем xcarchive — это гарантированно создаст нужные файлы без требования локальных сертификатов Mac
          flutter build ios --release --no-codesign

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Находим созданный архив приложения
          ARCHIVE_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          echo "Found App Bundle at: $ARCHIVE_PATH"
          
          # Утилита altool умеет упаковывать и отправлять напрямую .app или .xcarchive
          # Передаем напрямую сгенерированное приложение
          xcrun altool --upload-app --type ios --file "$ARCHIVE_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
